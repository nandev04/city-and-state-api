services:
  database:
    container_name: local_postgres
    image: postgres:18.3
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres:/var/lib/postgresql
    ports:
      - '${POSTGRES_PORT}:5432'

volumes:
  postgres:
